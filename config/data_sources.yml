  resolucao_espacial: "poligonos"
  data_teste: "2026-09-03"
  status_teste: "pendente"
  observacao_teste: "Portais reachable (HTTP 200). Falta localizar e testar o download direto dos poligonos das UCs marinhas (geoservicos CNUC/MMA)."

